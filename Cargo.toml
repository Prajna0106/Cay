[workspace]
resolver = "2"
members = [
    "crates/cay-core",
    "crates/cay-providers",
    "crates/cay-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cay Contributors"]
license = "MIT"
repository = "https://github.com/cay/cay"

[workspace.dependencies]
cay-core = { path = "crates/cay-core" }
cay-providers = { path = "crates/cay-providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "UI_Notifications",
    "UI_Notifications_Management",
    "System_Power",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune.git", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
winit = { git = "https://github.com/anomalyco/rune.git", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_windows = { git = "https://github.com/anomalyco/rune.git", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_macos = { git = "https://github.com/anomalyco/rune.git", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }

